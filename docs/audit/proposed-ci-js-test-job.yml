#
# This session cannot write .github/workflows/ci.yml: that path is protected
# against remote writes, so the change below has NOT been applied. It is the
# one piece of batch 6a still outstanding.
#
# TO APPLY: paste the `js-test:` job below into .github/workflows/ci.yml,
# under the `jobs:` key, immediately BEFORE the existing `type-check:` job.
# Indentation is already correct (two spaces for the job key).
#
# WHY IT IS SAFE:
#   * Purely additive. It does not touch the `lint` or `test` jobs, and both
#     keep continue-on-error unset (i.e. still hard gates).
#   * ubuntu-latest, not a Windows runner: these suites are dependency-free
#     Node scripts that run the real sara/gui/js files in a `vm` against a
#     small fake DOM. No browser, no npm install, no winsdk.
#   * Each script already exits non-zero on a failed assertion, so `set -e`
#     plus the loop is a real gate.
#
# VERIFIED LOCALLY (Linux, node v22):
#   sara/gui/js/tests/bridge_contract.test.js   19 passed, 0 failed
#   sara/gui/js/tests/chat_state.test.js        11 passed, 0 failed
#   sara/gui/js/tests/ui_prefs_theme.test.js    47 passed, 0 failed
#   ci.yml with this job parses; jobs = lint, test, js-test, type-check, bench
#
# NOTE: these 77 front-end tests are currently run by NOTHING in CI. That is
# why the theme-ordering failure fixed in batch 6a went unnoticed.

  js-test:
    name: Front-end tests (node)
    # ubuntu-latest on purpose: these suites are dependency-free Node scripts
    # that run the real js/ files in a `vm` against a tiny fake DOM. They need
    # no Windows, no browser and no npm install, so there is no reason to spend
    # a Windows runner on them. This job is ADDITIVE -- it does not change the
    # lint or test gates above.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run front-end test suites
        shell: bash
        run: |
          set -e
          # Each script exits non-zero on any failed assertion.
          for f in sara/gui/js/tests/*.test.js; do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done
