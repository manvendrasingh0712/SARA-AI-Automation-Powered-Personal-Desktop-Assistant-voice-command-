<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="Benchmark highlights: router accuracy 99.4 percent, memory recall at 3 98.1 percent, injection recall on covered attacks 100 percent, router latency p95 1.51 milliseconds" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="n" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d8bff"/>
      <stop offset="1" stop-color="#d45ad0"/>
    </linearGradient>
  </defs>
  <style>
    .card{fill:#12121f;stroke:#2a2a45;stroke-width:1.5}
    .num{font:700 52px "Segoe UI",Helvetica,Arial,sans-serif;fill:url(#n)}
    .lab{font:600 18px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6e6f5}
    .sub{font:15px "Segoe UI",Helvetica,Arial,sans-serif;fill:#8d8db3}
  </style>
  <rect class="card" x="5" y="5" width="285" height="180" rx="14"/>
  <rect class="card" x="305" y="5" width="285" height="180" rx="14"/>
  <rect class="card" x="605" y="5" width="285" height="180" rx="14"/>
  <rect class="card" x="905" y="5" width="285" height="180" rx="14"/>
  <text class="num" x="28" y="82">99.4%</text>
  <text class="lab" x="28" y="116">Command routing accuracy</text>
  <text class="sub" x="28" y="142">620 labelled utterances</text>
  <text class="sub" x="28" y="164">0.0% false triggers</text>
  <text class="num" x="328" y="82">98.1%</text>
  <text class="lab" x="328" y="116">Memory recall@3</text>
  <text class="sub" x="328" y="142">vs 54.3% for plain vector RAG</text>
  <text class="sub" x="328" y="164">offline, gold-labelled facts</text>
  <text class="num" x="628" y="82">63 / 72</text>
  <text class="lab" x="628" y="116">Injection attacks covered</text>
  <text class="sub" x="628" y="142">100% blocked on those 63</text>
  <text class="sub" x="628" y="164">9 documented gaps remain</text>
  <text class="num" x="928" y="82">1.51 ms</text>
  <text class="lab" x="928" y="116">Router latency (p95)</text>
  <text class="sub" x="928" y="142">router only, not full voice</text>
  <text class="sub" x="928" y="164">measured on Linux</text>
</svg>
