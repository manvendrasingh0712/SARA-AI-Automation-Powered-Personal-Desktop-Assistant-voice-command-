name: CI

on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint and dependency audit
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt

      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.lock.txt

      - name: Run Pyflakes on tracked project sources and tests
        shell: bash
        run: |
          mapfile -t PY_FILES < <(git ls-files --cached --others --exclude-standard -- '*.py')
          python -m pyflakes "${PY_FILES[@]}"

      - name: Audit runtime, development, and build locks
        shell: bash
        run: |
          set -euo pipefail
          for lockfile in requirements-cpu.lock.txt requirements-dev.lock.txt requirements-build.lock.txt; do
            echo "::group::pip-audit $lockfile"
            # These two narrow exceptions are reviewed in docs/SECURITY_EXCEPTIONS.md.
            python -m pip_audit -r "$lockfile" \
              --ignore-vuln PYSEC-2026-3447 \
              --ignore-vuln GHSA-xmj3-9gf7-h52w
            echo "::endgroup::"
          done

  test:
    name: Python tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt

      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.lock.txt

      - name: Run tests with coverage
        shell: bash
        run: >-
          python -m pytest tests/ -v --strict-config --strict-markers
          --junitxml=test-results.xml
          --cov=sara --cov=config --cov=main
          --cov-report=xml --cov-report=term-missing

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  js-test:
    name: Front-end tests (node)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Run front-end test suites
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(sara/gui/js/tests/*.test.js)
          if ((${#tests[@]} == 0)); then
            echo "No JavaScript test files were found." >&2
            exit 1
          fi
          for test_file in "${tests[@]}"; do
            echo "::group::$test_file"
            node "$test_file"
            echo "::endgroup::"
          done

  type-check:
    name: Type check (mypy)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt

      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.lock.txt

      - name: Run mypy
        shell: bash
        run: python -m mypy sara/ --show-error-codes

  bench:
    name: Bench (router accuracy)
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: true # advisory: latency baselines vary by runner hardware
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-cpu.lock.txt

      - name: Install locked CPU dependencies
        run: python -m pip install -r requirements-cpu.lock.txt

      - name: Router benchmark vs baseline
        shell: bash
        run: python -m bench.run_bench --mode router --compare bench/baseline.json --report-md bench/results/RESULTS.md

      - name: Red-team gate
        shell: bash
        run: python -m bench.run_bench --mode redteam --gate

      - name: Memory benchmark gate
        shell: bash
        run: python -m bench.run_bench --mode memory --embedder hash --gate

      - name: Upload bench report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench/results/RESULTS.md
          if-no-files-found: warn
          retention-days: 14

  hygiene:
    name: Hygiene (secrets, compile, GUI bundle)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt

      - name: No credentials in tracked files
        run: python scripts/check_no_secrets.py

      - name: Byte-compile project Python files
        shell: bash
        run: |
          mapfile -t PY_FILES < <(git ls-files --cached --others --exclude-standard -- '*.py')
          python -m py_compile "${PY_FILES[@]}"

      - name: GUI bundle matches its sources
        run: python sara/gui/build.py --check
          done
